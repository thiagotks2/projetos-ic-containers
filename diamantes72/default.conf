server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Listagem de diretórios na raiz (ex: localhost/)
    location / {
        root /var/www/html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Site dinâmico para /nomedosite/...
    location ~ ^/([^/]+)/(.*)$ {
        set $site $1;
        set $subpath $2;
        root /var/www/html;

        try_files /$site/$subpath /$site/index.php?$args;

        location ~ ^/([^/]+)/(.*\.php)$ {
            set $site $1;
            set $phpfile $2;
            root /var/www/html;
            fastcgi_pass unix:/run/php/php7.2-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/$site/$phpfile;
        }
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot|otf|mp4|webmanifest)$ {
        root /var/www/html;
        expires max;
        log_not_found off;
    }
}
