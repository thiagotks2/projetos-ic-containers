services:
  mongo80:
    container_name: mongo80
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: infocenter
      MONGO_INITDB_ROOT_PASSWORD: infocenter6148
      MONGO_INITDB_DATABASE: admin
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - "27017:27017"
    volumes:
      - 'dck-mongo80:/data/db'
      - ./novosdiamantes/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - dck

  novosdiamantes:
    build:
      context: ./novosdiamantes
      dockerfile: Dockerfile
    container_name: novosdiamantes
    ports:
      - "80:80"
      - "3000:3000"
      - "3001:3001"
      - "9000:9000"
    volumes:
      - ./www:/var/www/html
      - ./novosdiamantes/novosdiamantesindex.php:/var/www/html/novosdiamantesindex.php
      - ./novosdiamantes/default.conf:/etc/nginx/sites-available/default
      - ./novosdiamantes/logs/nginx:/var/log/nginx
    tty: true
    stdin_open: true
    depends_on:
      - mongo80
    networks:
      - dck

networks:
  dck:
    driver: bridge

volumes:
  dck-mongo80:
    driver: local
