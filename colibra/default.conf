# VirtualHost: tarefas.localhost
server {
    listen 80;
    server_name tarefas.localhost;
    root /var/www/html/tarefas;
    index index.php index.html;
    client_max_body_size 100M;

    access_log /var/log/nginx/tarefas_access.log;
    error_log /var/log/nginx/tarefas_error.log;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php7.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot|otf|mp4|webmanifest)$ {
        expires max;
        log_not_found off;
    }
}

