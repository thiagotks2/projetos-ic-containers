server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = / {
        index index.php;
        try_files /index.php =404;

        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
    }

    # Resto das rotas
    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }

    # Laravel em subdiretório, ex: /hrimoveis/public
    location ~ ^/([^/]+)/public(/.*)?$ {
        root /var/www/html;
        index index.php;

        # Redireciona todas as rotas para o index.php correto da subpasta
        try_files $uri $uri/ /$1/public/index.php?$args;

        # Bloco PHP para Laravel nested
        location ~ ^/([^/]+)/public(/.*\.php)$ {
            root /var/www/html;
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/$1/public$2;
        }
    }

    # Processamento geral de PHP na raiz
    location ~ \.php$ {
        root /var/www/html;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Cache de arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
