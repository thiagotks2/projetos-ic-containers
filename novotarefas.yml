services:

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novotarefas
      POSTGRES_PASSWORD: tarefas4286
      POSTGRES_DB: novotarefas
    ports:
      - "5432:5432"
    volumes:
      - dck-pgdata-novosdiamantes:/var/lib/postgresql/data
    networks:
      - dck-novosdiamantes

  mongo:
    container_name: mongo
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: infocenter
      MONGO_INITDB_ROOT_PASSWORD: infocenter6148
      MONGO_INITDB_DATABASE: admin
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - "27017:27017"
    volumes:
      - 'dck-mongo-novosdiamantes:/data/db'
      - ./novotarefas/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - dck-novosdiamantes

  novotarefas:
    build:
      context: ./novotarefas
      dockerfile: Dockerfile
    container_name: novotarefas
    ports:
      - "80:80"
      - "3000:3000"
      - "3001:3001"
      - "9000:9000"
    volumes:
      - ./www/novotarefas:/var/www/html
      - ./novotarefas/default.conf:/etc/nginx/sites-available/default
      - ./novotarefas/logs/nginx:/var/log/nginx
    tty: true
    stdin_open: true
    depends_on:
      - mongo
    networks:
      - dck-novosdiamantes

networks:
  dck-novosdiamantes:
    driver: bridge

volumes:
  dck-mongo-novosdiamantes:
    driver: local
  dck-pgdata-novosdiamantes:
    driver: local
